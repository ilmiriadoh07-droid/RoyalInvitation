<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>The Wedding of Hadi & Riya</title><link rel="preconnect"
href="https://fonts.googleapis.com"><link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500&display=swap"
rel="stylesheet"><style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#050505;
    color:#fff;
    font-family:Montserrat,sans-serif;
}

.cover{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    position:relative;
    overflow:hidden;
}

.cover::before{
    content:"";
    position:absolute;
    inset:0;

    background:
    radial-gradient(
        circle at center,
        rgba(212,175,55,.18),
        transparent 35%
    );
}

.content{
    position:relative;
    z-index:2;
    padding:30px;
}

.small{
    font-size:10px;
    letter-spacing:5px;
    color:#c8b47a;
}

h1{
    margin:25px 0;

    font-family:"Cormorant Garamond",serif;

    font-size:70px;

    font-weight:400;

    color:#d4af37;
}

.date{
    color:#aaa;
    font-size:12px;
    letter-spacing:3px;
}

.line{
    width:100px;
    height:1px;
    margin:30px auto;

    background:#d4af37;
}

.open{
    display:inline-block;

    margin-top:30px;

    padding:14px 30px;

    border:1px solid #d4af37;

    color:#d4af37;

    text-decoration:none;

    font-size:10px;

    letter-spacing:3px;

    text-transform:uppercase;
}

@media(max-width:600px){

h1{
    font-size:52px;
}

}

</style></head><body><section class="cover"><div class="content"><div class="small">
THE WEDDING OF
</div><h1>
Hadi<br>
&
Riya
</h1><div class="line"></div><div class="date">
SAVE THE DATE
</div><a href="#" class="open">
Buka Undangan
</a></div></section></body></html>
